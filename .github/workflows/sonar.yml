
name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test and SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular project
        run: npm run build

      - name: Check test configuration
        run: |
          echo "Verificando configuración de pruebas..."
          if grep -q '"test": {' angular.json; then
            npm test -- --watch=false --browsers=ChromeHeadless
          else
            echo "No existe un objetivo test configurado en angular.json."
            echo "Las pruebas no se ejecutaron."
            echo "Se continuará con el análisis estático de SonarQube Cloud."
          fi

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
